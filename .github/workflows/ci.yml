name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v
      - name: Remote protocol, authorization and queue round trip (no device)
        run: |
          python3 -m pip install -r remote-management/requirements.txt
          python3 -m unittest discover -s remote-management -p 'test_*.py' -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 430080 || { echo "APK is over 420 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      - name: Opt-in remote prototype build, lint and unit tests (no device)
        working-directory: launcher
        run: ./gradlew --no-daemon testRemoteUnitTest lintRemote assembleRemote testRescueUnitTest lintRescue assembleRescue
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload opt-in remote prototype (not installed or published)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Remote-Prototype
          path: launcher/app/build/outputs/apk/remote/app-remote.apk
          if-no-files-found: error
      - name: Upload forward-only rescue prototype
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Rescue-Prototype
          path: launcher/app/build/outputs/apk/rescue/app-rescue.apk
          if-no-files-found: error
