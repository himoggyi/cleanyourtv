plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    signingConfigs {
        if (providers.environmentVariable('PROJECTOR_KEYSTORE').isPresent()) {
            owner {
                storeFile file(providers.environmentVariable('PROJECTOR_KEYSTORE').get())
                storePassword providers.environmentVariable('PROJECTOR_STORE_PASSWORD').get()
                keyAlias providers.environmentVariable('PROJECTOR_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('PROJECTOR_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
        // Explicit opt-in: the ordinary release keeps its local-only manifest and size budget.
        remote {
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-remote-prototype'
            if (signingConfigs.findByName('owner') != null) signingConfig signingConfigs.owner
        }
        rescue {
            initWith release
            matchingFallbacks = ['release']
            // Forward-only rollback: same private preferences and theme files, no remote service.
            versionNameSuffix '-rescue'
            if (signingConfigs.findByName('owner') != null) signingConfig signingConfigs.owner
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType == 'remote' || variant.buildType == 'rescue') {
            def property = variant.buildType == 'remote' ? 'remoteVersionCode' : 'rescueVersionCode'
            def fallback = variant.buildType == 'remote' ? '7' : '8'
            variant.outputs.each { output ->
                output.versionCode.set(providers.gradleProperty(property).getOrElse(fallback).toInteger())
            }
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
